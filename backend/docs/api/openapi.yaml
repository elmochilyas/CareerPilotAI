openapi: 3.1.0
info:
  title: CareerPilot AI API — Skills and Evidence
  version: 1.0.0
  description: |
    Skills and Evidence capability.
    All endpoints require Sanctum cookie-based SPA authentication.

servers:
  - url: http://careerpilot-api.test/api/v1
    description: Local Herd development server

paths:
  /skills:
    get:
      operationId: searchSkills
      summary: Search canonical skill catalog
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 100
          description: Search query (min 2 chars, searches name, normalized_name, and aliases)
        - name: category
          in: query
          schema:
            type: string
            maxLength: 100
          description: Filter by category
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
      responses:
        '200':
          description: Paginated list of active canonical skills with aliases
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /skills/{skill}:
    get:
      operationId: showSkill
      summary: Show a single canonical skill
      security:
        - cookieAuth: []
      parameters:
        - name: skill
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Single canonical skill with aliases
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Skill'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /candidate/skills:
    get:
      operationId: listCandidateSkills
      summary: List authenticated candidate's skills
      security:
        - cookieAuth: []
      parameters:
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/SkillState'
          description: Filter by state
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Paginated list of candidate's skills with evidence summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CandidateSkill'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createCandidateSkill
      summary: Add a skill to candidate's inventory
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - state
                - proficiency_level
              properties:
                skill_id:
                  type: integer
                  nullable: true
                  description: Canonical skill ID (null for custom skills)
                custom_skill_name:
                  type: string
                  maxLength: 150
                  description: Required when skill_id is null
                state:
                  $ref: '#/components/schemas/SkillState'
                proficiency_level:
                  $ref: '#/components/schemas/ProficiencyLevel'
                years_experience:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 30
                  nullable: true
                last_used_at:
                  type: string
                  format: date
                  nullable: true
      responses:
        '201':
          description: Created candidate skill
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateSkill'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /candidate/skills/{candidateSkill}:
    get:
      operationId: showCandidateSkill
      summary: Show one candidate skill with evidence
      security:
        - cookieAuth: []
      parameters:
        - name: candidateSkill
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Full candidate skill with evidence array
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateSkill'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCandidateSkill
      summary: Update proficiency, state, years experience, or last used date
      security:
        - cookieAuth: []
      parameters:
        - name: candidateSkill
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  $ref: '#/components/schemas/SkillState'
                proficiency_level:
                  $ref: '#/components/schemas/ProficiencyLevel'
                years_experience:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 30
                  nullable: true
                last_used_at:
                  type: string
                  format: date
                  nullable: true
                updated_at:
                  type: string
                  format: date-time
                  description: Required for optimistic concurrency. Must match current updated_at value.
      responses:
        '200':
          description: Updated candidate skill
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateSkill'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteCandidateSkill
      summary: Delete a candidate skill (only when state is claimed or learning)
      security:
        - cookieAuth: []
      parameters:
        - name: candidateSkill
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                updated_at:
                  type: string
                  format: date-time
                  description: Required for optimistic concurrency
      responses:
        '204':
          description: Skill deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /candidate/skills/{candidateSkill}/archive:
    post:
      operationId: archiveCandidateSkill
      summary: Archive a skill (valid from any non-archived state)
      security:
        - cookieAuth: []
      parameters:
        - name: candidateSkill
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                updated_at:
                  type: string
                  format: date-time
                  description: Required for optimistic concurrency
      responses:
        '200':
          description: Archived skill
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateSkill'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /candidate/skills/{candidateSkill}/restore:
    post:
      operationId: restoreCandidateSkill
      summary: Restore an archived skill to a target state
      security:
        - cookieAuth: []
      parameters:
        - name: candidateSkill
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - state
              properties:
                state:
                  $ref: '#/components/schemas/SkillState'
                  description: Target state after restore (claimed, learning, or verified)
                updated_at:
                  type: string
                  format: date-time
                  description: Required for optimistic concurrency
      responses:
        '200':
          description: Restored skill
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateSkill'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /candidate/skills/{candidateSkill}/evidence:
    post:
      operationId: addEvidence
      summary: Add evidence to a candidate skill
      security:
        - cookieAuth: []
      parameters:
        - name: candidateSkill
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - value
              properties:
                type:
                  $ref: '#/components/schemas/EvidenceType'
                value:
                  type: string
                  maxLength: 2048
                  description: URL for url type, profile_item_id for profile_item type
                label:
                  type: string
                  maxLength: 255
                  nullable: true
                updated_at:
                  type: string
                  format: date-time
                  description: Required for optimistic concurrency
      responses:
        '201':
          description: Evidence added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateSkill'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /candidate/skills/{candidateSkill}/evidence/{evidenceKey}:
    patch:
      operationId: updateEvidence
      summary: Update an evidence entry by UUID key
      security:
        - cookieAuth: []
      parameters:
        - name: candidateSkill
          in: path
          required: true
          schema:
            type: integer
        - name: evidenceKey
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 255
                  nullable: true
                value:
                  type: string
                  maxLength: 2048
                  description: New URL value (url type only)
                updated_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Evidence entry updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateSkill'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: removeEvidence
      summary: Remove an evidence entry by UUID key
      security:
        - cookieAuth: []
      parameters:
        - name: candidateSkill
          in: path
          required: true
          schema:
            type: integer
        - name: evidenceKey
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                updated_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Evidence entry removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateSkill'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: |
        Sanctum SPA cookie authentication.
        Requires a prior GET /sanctum/csrf-cookie request.
        Session cookie sent automatically with credentials: include.

  schemas:
    SkillState:
      type: string
      enum:
        - claimed
        - verified
        - learning
        - rejected
        - archived

    ProficiencyLevel:
      type: string
      enum:
        - beginner
        - elementary
        - intermediate
        - advanced
        - expert

    EvidenceType:
      type: string
      enum:
        - profile_item
        - url
        - text

    EvidenceEntry:
      type: object
      properties:
        key:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/EvidenceType'
        value:
          type: string
        label:
          type: string
          nullable: true
        profile_item_snapshot:
          type: object
          nullable: true
          properties:
            title:
              type: string
            type:
              type: string
            organization:
              type: string
              nullable: true
        added_at:
          type: string
          format: date-time

    Skill:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        normalized_name:
          type: string
        category:
          type: string
          nullable: true
        is_active:
          type: boolean
        aliases:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CandidateSkill:
      type: object
      properties:
        id:
          type: integer
        skill:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
            normalized_name:
              type: string
            category:
              type: string
              nullable: true
            aliases:
              type: array
              items:
                type: string
        is_custom:
          type: boolean
        state:
          $ref: '#/components/schemas/SkillState'
        proficiency_level:
          $ref: '#/components/schemas/ProficiencyLevel'
        years_experience:
          type: number
          format: float
          nullable: true
        last_used_at:
          type: string
          format: date
          nullable: true
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceEntry'
        verification_at_risk:
          type: boolean
          description: True when state is verified but evidence array is empty
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          description: URI identifying the problem type
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable error code for programmatic handling
        errors:
          type: object
          nullable: true
          description: Field-level validation errors
        request_id:
          type: string
          nullable: true

  responses:
    Unauthenticated:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://careerpilot.example/problems/unauthenticated
            title: Unauthenticated
            status: 401
            detail: Authentication required
            code: unauthenticated
    NotFound:
      description: Resource not found (or not owned)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://careerpilot.example/problems/not-found
            title: Not Found
            status: 404
            detail: The requested resource was not found
            code: not_found
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://careerpilot.example/problems/validation-error
            title: Validation Error
            status: 422
            detail: The given data was invalid
            code: validation_error
            errors:
              proficiency_level:
                - The selected proficiency level is invalid.
    Conflict:
      description: Conflict (stale updated_at or duplicate)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://careerpilot.example/problems/conflict
            title: Conflict
            status: 409
            detail: This skill was modified by another request. Please refresh and try again.
            code: candidate_skill_conflict

  errorCodes:
    candidate_skill_duplicate:
      httpStatus: 409
      description: Skill already exists in candidate's inventory
    candidate_skill_conflict:
      httpStatus: 409
      description: Stale updated_at value
    skill_state_transition_invalid:
      httpStatus: 422
      description: Requested state transition is not allowed
    skill_verification_requirements_not_met:
      httpStatus: 422
      description: Cannot transition to verified without evidence
    profile_item_evidence_not_owned:
      httpStatus: 422
      description: Referenced profile item does not exist or does not belong to the candidate
    skill_evidence_invalid:
      httpStatus: 422
      description: Evidence URL has an unsafe or unsupported scheme
    skill_evidence_not_found:
      httpStatus: 404
      description: Evidence key not found on the candidate skill
    candidate_skill_removal_forbidden:
      httpStatus: 422
      description: Cannot delete a skill in its current state (must archive instead)
