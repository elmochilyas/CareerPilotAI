openapi: 3.1.0
info:
  title: CareerPilot AI API
  version: 0.1.0
  description: |
    Career operating system for junior candidates.
    Base URL: `/api/v1`
    Authentication: Laravel Sanctum first-party SPA cookie auth.
servers:
  - url: http://careerpilot-api.test/api/v1
    description: Local development (Laravel Herd)
paths:
  /health:
    get:
      operationId: health-check
      summary: Health check
      description: Returns the current status of the API and critical services.
      tags:
        - Platform
      parameters:
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          required: false
          description: Client-provided request ID. A UUID is generated when omitted.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccess'
        '500':
          description: One or more services are unhealthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccess'
  /cv/upload:
    post:
      operationId: uploadCv
      summary: Upload a CV document
      tags:
        - CV Ingestion
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CV file (PDF or DOCX, max 10MB)
                mode:
                  type: string
                  enum: [create_new, update_existing]
                  default: create_new
                  description: Upload mode
              required:
                - file
      responses:
        '202':
          description: CV uploaded and processing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSuccess'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /cv/uploaded:
    get:
      operationId: listUploadedDocuments
      summary: List uploaded CV documents
      tags:
        - CV Ingestion
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of uploaded CV documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CvDocument'
  /cv/{cv}/status:
    get:
      operationId: getCvProcessingStatus
      summary: Get processing status for a CV document
      tags:
        - CV Ingestion
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: cv
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Processing status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CvProcessingStatus'
        '404':
          description: CV document not found
  /cv/{cv}/review-queue:
    get:
      operationId: getReviewQueue
      summary: Get review queue for a CV document
      tags:
        - CV Ingestion
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: cv
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Review queue with suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        type: string
                      suggestions:
                        type: array
                        items:
                          $ref: '#/components/schemas/CvSuggestion'
        '409':
          description: Not all suggestions reviewed or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /cv/{cv}/review-decisions:
    post:
      operationId: submitReviewDecisions
      summary: Submit review decisions for CV suggestions
      tags:
        - CV Ingestion
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: cv
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchReviewRequest'
      responses:
        '200':
          description: Review decisions saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSuccess'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Review already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /cv/{cv}/import-preview:
    get:
      operationId: previewImport
      summary: Preview what will be imported
      tags:
        - CV Ingestion
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: cv
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Import preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ImportPreview'
        '409':
          description: Not ready for import
  /cv/{cv}/apply:
    post:
      operationId: applyImport
      summary: Apply reviewed suggestions to profile
      tags:
        - CV Ingestion
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: cv
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profile_updated_at:
                  type: string
                  format: date-time
                  description: Profile timestamp for optimistic concurrency
      responses:
        '200':
          description: Import applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ImportResult'
        '409':
          description: Import already applied, not ready, or profile changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /cv/{cv}/import-result:
    get:
      operationId: getImportResult
      summary: Get the result of a completed import
      tags:
        - CV Ingestion
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: cv
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ImportResult'
        '404':
          description: Import result not found
  /matches/{id}/clarifications:
    get:
      operationId: listClarifications
      summary: List the open clarification session for a match analysis
      description: Returns the actionable clarification questions for an analysis with progress. A cross-user or nonexistent analysis is reported as not found.
      tags:
        - Clarifications
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Clarification session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClarificationSession'
        '404':
          description: Match analysis not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: generateClarifications
      summary: Generate the clarification session for a match analysis
      description: Builds the open clarification session from eligible uncertain findings on demand. Existing findings are never duplicated, so regenerating returns the current session. A cross-user or nonexistent analysis is reported as not found.
      tags:
        - Clarifications
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Existing clarification session (no new questions)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClarificationSession'
        '201':
          description: Clarification session generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClarificationSession'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Match analysis not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /clarifications/{id}/answer:
    post:
      operationId: answerClarification
      summary: Record an answer to a clarification question
      description: Records the candidate's answer as pending input. A proposal must be built and explicitly accepted before trusted profile data changes.
      tags:
        - Clarifications
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                properties:
                  answer_type:
                    type: string
                    enum: [yes, no, no_with_ack, text, select_option, number]
                  value:
                    type: string
                    nullable: true
                    maxLength: 2000
                    description: Required for number, select_option, and yes without a no-evidence acknowledgement. For yes without acknowledgement it must be an HTTPS evidence URL. Omitted or empty for no, no_with_ack, and yes with a no-evidence acknowledgement.
                  acknowledged_no_evidence:
                    type: boolean
              required:
                - answer_type
      responses:
        '201':
          description: Answer recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClarificationAnswer'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Answer already exists or session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Validation error or invalid evidence URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /clarifications/{id}/review:
    post:
      operationId: reviewClarification
      summary: Review a pending answer's proposal
      description: Without a decision, builds (when missing) and returns the proposal for preview with no mutation. An accept or edit applies the trusted change; a reject or skip records the rejection without any profile change.
      tags:
        - Clarifications
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  $ref: '#/components/schemas/ReviewDecision'
                edited_value:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Answer with embedded proposal
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClarificationAnswer'
        '404':
          description: No answer exists for the question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Proposal or answer is no longer reviewable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Validation error or invalid review edit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /clarifications/{id}/skip:
    post:
      operationId: skipClarification
      summary: Skip a clarification question
      description: Skips an open question without creating an answer or proposal. Skipping an already-skipped or expired question is idempotent.
      tags:
        - Clarifications
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Question skipped
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        type: string
                    required:
                      - id
                      - status
        '404':
          description: Question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Question already has an answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      schema:
        type: string
        format: uuid
      required: false
      description: Client-provided request ID. A UUID is generated when omitted.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 64
      required: true
      description: Idempotency key to prevent duplicate processing.
  schemas:
    HealthSuccess:
      type: object
      description: Health check success response.
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              enum: [pass, fail]
            timestamp:
              type: string
              format: date-time
              description: ISO 8601 UTC timestamp.
            services:
              type: object
              properties:
                database:
                  type: string
                  enum: [up, down]
          required:
            - status
            - timestamp
            - services
        request_id:
          type: string
          format: uuid
          description: Request identifier for tracing.
      required:
        - data
        - request_id
    ProblemDetail:
      type: object
      description: RFC 9457 problem detail.
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type.
        title:
          type: string
          description: Short human-readable title.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation.
        instance:
          type: string
          format: uri
          description: URI identifying the specific occurrence.
        code:
          type: string
          description: Stable application error code.
        errors:
          type: object
          description: Validation errors keyed by field.
        request_id:
          type: string
          format: uuid
          description: Request identifier for tracing.
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - errors
        - request_id
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - description: 422 Validation Error
          properties:
            code:
              example: validation_error
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    UploadSuccess:
      type: object
      description: Successful upload or save response.
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
            status:
              type: string
          required:
            - id
            - status
      required:
        - data
    CvDocument:
      type: object
      properties:
        id:
          type: integer
        original_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
        status:
          type: string
        latest_run:
          $ref: '#/components/schemas/CvProcessingRun'
      required:
        - id
        - original_name
        - status
    CvProcessingRun:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        error_message:
          type: string
          nullable: true
    CvProcessingStatus:
      type: object
      properties:
        id:
          type: integer
        original_name:
          type: string
        status:
          type: string
        runs:
          type: array
          items:
            $ref: '#/components/schemas/CvProcessingRun'
    CvSuggestion:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        suggested_value:
          type: object
        confidence:
          type: number
          format: float
        reason:
          type: string
          nullable: true
        review_status:
          type: string
          nullable: true
        reviewed_decision:
          type: object
          nullable: true
    BatchReviewRequest:
      type: object
      properties:
        decisions:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: Suggestion ID
              action:
                type: string
                enum: [accept, reject]
              value:
                type: object
                description: Edited value when action is accept
      required:
        - decisions
    ImportPreview:
      type: object
      properties:
        id:
          type: integer
        ready:
          type: boolean
        profile_updated_at:
          type: string
          format: date-time
        summary:
          type: object
          properties:
            headline:
              type: string
              nullable: true
            summary:
              type: string
              nullable: true
            skills_count:
              type: integer
            experiences_count:
              type: integer
            educations_count:
              type: integer
            projects_count:
              type: integer
            certifications_count:
              type: integer
            languages_count:
              type: integer
            social_links_count:
              type: integer
    ImportResult:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [applied, failed]
        summary:
          type: object
          properties:
            fields_updated:
              type: integer
            items_created:
              type: integer
            items_updated:
              type: integer
            skills_added:
              type: integer
            skipped:
              type: integer
    ClarificationSession:
      type: object
      description: >
        Open clarification session for an analysis. `questions` contains only
        actionable items (pending or answered with a pending review); `progress`
        counts all questions. `generable_count` is how many additional questions
        a generate call would create right now; zero means generation would be a
        dead end.
      properties:
        analysis_id:
          type: integer
        questions:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationQuestion'
        progress:
          $ref: '#/components/schemas/ClarificationProgress'
        generable_count:
          type: integer
          description: Number of questions a generate call would create right now.
      required:
        - analysis_id
        - questions
        - progress
        - generable_count
    ClarificationProgress:
      type: object
      description: >
        Progress over all clarification questions for the analysis, not only the
        open subset. `total` is the full question count and stays fixed as
        questions are resolved; `answered` counts questions that have an answer.
      properties:
        answered:
          type: integer
        total:
          type: integer
      required:
        - answered
        - total
    ClarificationQuestion:
      type: object
      properties:
        id:
          type: integer
        question_no:
          type: integer
        question_type:
          type: string
        prompt:
          type: string
        detail:
          type: string
          nullable: true
        template_key:
          type: string
        options:
          type: array
          nullable: true
          items:
            type: string
        unit:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, answered, skipped, expired]
        requirement:
          type: object
          properties:
            text:
              type: string
              nullable: true
            label:
              type: string
              nullable: true
          required:
            - text
            - label
        answer:
          anyOf:
            - $ref: '#/components/schemas/ClarificationAnswer'
            - type: 'null'
      required:
        - id
        - question_no
        - question_type
        - prompt
        - detail
        - template_key
        - options
        - unit
        - status
        - requirement
        - answer
    ClarificationAnswer:
      type: object
      properties:
        id:
          type: integer
        question_id:
          type: integer
        answer_type:
          type: string
          enum: [yes, no, no_with_ack, text, select_option, number]
        value:
          type: string
        acknowledged_no_evidence:
          type: boolean
        status:
          type: string
        proposal:
          anyOf:
            - $ref: '#/components/schemas/ClarificationProposal'
            - type: 'null'
      required:
        - id
        - question_id
        - answer_type
        - value
        - acknowledged_no_evidence
        - status
        - proposal
    ClarificationProposal:
      type: object
      properties:
        id:
          type: integer
        answer_id:
          type: integer
        target:
          type: object
          properties:
            type:
              type: string
            id:
              type: integer
              nullable: true
          required:
            - type
            - id
        field:
          type: string
        before_value:
          type: object
          nullable: true
        after_value:
          type: object
          nullable: true
        status:
          type: string
      required:
        - id
        - answer_id
        - target
        - field
        - before_value
        - after_value
        - status
    ReviewDecision:
      type: string
      enum: [accept, edit, reject, skip]
