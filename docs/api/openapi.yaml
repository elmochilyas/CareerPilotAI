openapi: 3.1.0
info:
  title: CareerPilot AI API
  version: 0.1.0
  description: |
    CareerPilot AI API — candidate profile management and authentication.
    Base URL: `/api/v1`
    Authentication: Laravel Sanctum first-party SPA cookie auth.

servers:
  - url: http://careerpilot-api.test
    description: Local development
  - url: https://careerpilot-api.test
    description: Local development (HTTPS)

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: Sanctum API token authentication (for non-SPA clients)
    cookie:
      type: apiKey
      in: cookie
      name: careerpilot_session
      description: |
        SPA authentication uses Laravel Sanctum cookie-based sessions.
        The client must first fetch `GET /sanctum/csrf-cookie` to obtain
        an XSRF-TOKEN cookie, then include `X-XSRF-TOKEN` in subsequent
        state-changing requests.

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        role:
          type: string
          enum: [candidate, admin]
        account_status:
          type: string
          enum: [active, suspended, disabled]
        timezone:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - full_name
        - email
        - role
        - account_status
        - timezone
        - created_at
        - updated_at

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        request_id:
          type: string

    CvDocument:
      type: object
      properties:
        id:
          type: integer
        original_name:
          type: string
        mime_type:
          type: string
        size:
          type: integer
        status:
          type: string
          enum: [pending, queued, validating, extracting, analyzing, ready_for_review, importing, imported, failed, deleted]
        failure_reason:
          type: string
          nullable: true
        failure_code:
          type: string
          nullable: true
        latest_run:
          $ref: '#/components/schemas/CvProcessingRun'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CvProcessingRun:
      type: object
      properties:
        id:
          type: integer
        cv_document_id:
          type: integer
        status:
          type: string
        pipeline_version:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        failure_reason:
          type: string
          nullable: true
        failure_code:
          type: string
          nullable: true
        ai_provider:
          type: string
          nullable: true
        ai_model:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    CvSuggestion:
      type: object
      properties:
        id:
          type: integer
        cv_document_id:
          type: integer
        type:
          type: string
          enum: [headline, summary, social_link, experience, education, project, certification, language, skill]
        category:
          type: string
          nullable: true
        field_name:
          type: string
          nullable: true
        current_value:
          type: object
          nullable: true
        suggested_value:
          type: object
        extraction_method:
          type: string
          enum: [deterministic_parser, ai_extraction]
        confidence:
          type: number
          format: float
          nullable: true
        review_status:
          type: string
          enum: [pending, accepted, edited, rejected, keep_existing, imported, import_failed]
        reviewed_decision:
          type: object
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true

    CvImportBatch:
      type: object
      properties:
        id:
          type: integer
        cv_document_id:
          type: integer
        status:
          type: string
          enum: [pending, applied, failed, partially_applied]
        idempotency_key:
          type: string
          nullable: true
        imported_at:
          type: string
          format: date-time
          nullable: true
        failure_reason:
          type: string
          nullable: true
        failure_code:
          type: string
          nullable: true
        summary:
          type: object
          nullable: true
          properties:
            total:
              type: integer
            accepted:
              type: integer
            rejected:
              type: integer
            skipped:
              type: integer
            errors:
              type: integer
        created_at:
          type: string
          format: date-time

    ImportPreview:
      type: object
      properties:
        summary:
          type: object
          properties:
            total:
              type: integer
            accepted:
              type: integer
            rejected:
              type: integer
            keep_existing:
              type: integer
            edited:
              type: integer
        conflicts:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              field:
                type: string
              current: {}
              suggested: {}
              message:
                type: string

    ReviewDecision:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum: [accept, edit, reject, keep_existing]
        edited_value:
          type: object

    ProfileItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [education, experience, project, certification]
        title:
          type: string
        organization:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
        display_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, type, title, display_order, created_at, updated_at]

    CompletionArea:
      type: object
      properties:
        key:
          type: string
        earned:
          type: integer
        available:
          type: integer
        complete:
          type: boolean
        guidance:
          type: string
          nullable: true
      required: [key, earned, available, complete, guidance]

    CompletionDetails:
      type: object
      properties:
        areas:
          type: array
          items:
            $ref: '#/components/schemas/CompletionArea'
        missing_areas:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              guidance:
                type: string
            required: [key, guidance]
      required: [areas, missing_areas]

    CandidateProfile:
      type: object
      properties:
        id:
          type: integer
          nullable: true
        full_name:
          type: string
        headline:
          type: string
          nullable: true
        professional_summary:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        linkedin_url:
          type: string
          format: uri
          nullable: true
        github_url:
          type: string
          format: uri
          nullable: true
        portfolio_url:
          type: string
          format: uri
          nullable: true
        availability_status:
          type: string
          enum: [immediately, within_2_weeks, within_month, not_looking]
          nullable: true
        target_roles:
          type: array
          items:
            type: string
        preferred_locations:
          type: array
          items:
            type: string
        work_mode:
          type: string
          enum: [remote, hybrid, on_site]
          nullable: true
        contract_types:
          type: array
          items:
            type: string
        salary_min:
          type: string
          nullable: true
        salary_max:
          type: string
          nullable: true
        languages:
          type: array
          items:
            type: object
            properties:
              language:
                type: string
              proficiency:
                type: string
                enum: [native, fluent, advanced, intermediate, basic]
            required: [language, proficiency]
        profile_completion:
          type: number
          format: float
        completion_details:
          $ref: '#/components/schemas/CompletionDetails'
        items:
          type: object
          properties:
            education:
              type: array
              items:
                $ref: '#/components/schemas/ProfileItem'
            experience:
              type: array
              items:
                $ref: '#/components/schemas/ProfileItem'
            project:
              type: array
              items:
                $ref: '#/components/schemas/ProfileItem'
            certification:
              type: array
              items:
                $ref: '#/components/schemas/ProfileItem'
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: [full_name, profile_completion, completion_details, items]

    ProfileUpdate:
      type: object
      properties:
        headline:
          type: string
          maxLength: 255
          nullable: true
        professional_summary:
          type: string
          maxLength: 5000
          nullable: true
        phone:
          type: string
          nullable: true
        city:
          type: string
          maxLength: 100
          nullable: true
        country:
          type: string
          maxLength: 100
          nullable: true
        linkedin_url:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        github_url:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        portfolio_url:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        availability_status:
          type: string
          enum: [immediately, within_2_weeks, within_month, not_looking]
          nullable: true
        target_roles:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 10
        preferred_locations:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 10
        work_mode:
          type: string
          enum: [remote, hybrid, on_site]
          nullable: true
        contract_types:
          type: array
          items:
            type: string
            enum: [full-time, part-time, contract, internship, freelance]
          maxItems: 5
        salary_min:
          type: number
          minimum: 0
          nullable: true
        salary_max:
          type: number
          minimum: 0
          nullable: true
        languages:
          type: array
          items:
            type: object
            properties:
              language:
                type: string
                maxLength: 50
              proficiency:
                type: string
                enum: [native, fluent, advanced, intermediate, basic]
            required: [language, proficiency]
          maxItems: 10
        updated_at:
          type: string
          format: date-time

    ProfileItemInput:
      type: object
      properties:
        type:
          type: string
          enum: [education, experience, project, certification]
        title:
          type: string
          maxLength: 255
        organization:
          type: string
          maxLength: 255
          nullable: true
        location:
          type: string
          maxLength: 255
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
          maxLength: 5000
          nullable: true
        metadata:
          type: object
          nullable: true
      required: [type, title]

    ReorderRequest:
      type: object
      properties:
        type:
          type: string
          enum: [education, experience, project, certification]
        item_ids:
          type: array
          items:
            type: integer
      required: [type, item_ids]

    JobIngestion:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [draft, queued, processing, review_ready, confirmed, failed, cancelled]
        source_url:
          type: string
          format: uri
          nullable: true
        personal_label:
          type: string
          nullable: true
        failure_reason:
          type: string
          nullable: true
        failure_code:
          type: string
          nullable: true
        retry_count:
          type: integer
        last_retry_at:
          type: string
          format: date-time
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
        confirmed_opportunity_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    JobSuggestion:
      type: object
      properties:
        id:
          type: integer
        ingestion_id:
          type: integer
        type:
          type: string
        group_key:
          type: string
          nullable: true
        field:
          type: string
          nullable: true
        extracted_value:
          type: object
        edited_value:
          type: object
          nullable: true
        review_decision:
          type: string
          enum: [pending, accepted, edited, rejected, keep_blank, resolved]
        source_evidence:
          type: string
          nullable: true
        schema_version:
          type: string
        resolution:
          type: string
          nullable: true
        resolved_skill_id:
          type: integer
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
        created_at:
          type: string
          format: date-time
    PreviewOverview:
      type: object
      properties:
        title:
          type: string
        company:
          type: string
        department:
          type: string
        summary:
          type: string
    Opportunity:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        company_name:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        application_url:
          type: string
          format: uri
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        work_mode:
          type: string
          nullable: true
        contract_type:
          type: string
          nullable: true
        seniority_level:
          type: string
          nullable: true
        salary_min:
          type: number
          nullable: true
        salary_max:
          type: number
          nullable: true
        salary_currency:
          type: string
          nullable: true
        salary_period:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MatchAnalysisStatus:
      type: string
      enum: [queued, processing, completed, failed]

    MatchState:
      type: string
      enum: [matched, partial, gap, unknown]

    MatchImportance:
      type: string
      enum: [required, preferred]

    MatchCategory:
      type: string
      enum: [required_skills, preferred_skills, evidence, experience_education, language_soft]

    RequirementSourceType:
      type: string
      enum: [job_requirement, job_opportunity_skill]

    MatchCounts:
      type: object
      properties:
        required:
          type: integer
        preferred:
          type: integer
        matched:
          type: integer
        partial:
          type: integer
        gap:
          type: integer
        unknown:
          type: integer

    MatchVersions:
      type: object
      properties:
        algorithm:
          type: string
        scoring:
          type: string
        classifier_schema:
          type: string

    MatchFingerprints:
      type: object
      properties:
        profile:
          type: string
        opportunity:
          type: string

    MatchFailure:
      type: object
      properties:
        code:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true

    MatchClassifier:
      type: object
      properties:
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        prompt_version:
          type: string
          nullable: true
        latency_ms:
          type: integer
          nullable: true
        tokens_prompt:
          type: integer
          nullable: true
        tokens_completion:
          type: integer
          nullable: true
        response_id:
          type: string
          nullable: true
        status:
          type: string
          nullable: true

    MatchTimestamps:
      type: object
      properties:
        queued_at:
          type: string
          format: date-time
          nullable: true
        processing_started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        failed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MatchScoreComponent:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/MatchCategory'
        weight:
          type: number
          format: float
        score:
          type: number
          format: float
        achieved_points:
          type: number
          format: float
        total_points:
          type: number
          format: float
        has_candidate_data:
          type: boolean

    MatchEvidenceRef:
      type: object
      properties:
        type:
          type: string
        id:
          type: integer
          nullable: true
        label:
          type: string
          nullable: true

    MatchFinding:
      type: object
      properties:
        source_type:
          $ref: '#/components/schemas/RequirementSourceType'
        source_id:
          type: integer
        requirement_text:
          type: string
        requirement_label:
          type: string
          nullable: true
        importance:
          $ref: '#/components/schemas/MatchImportance'
        category:
          $ref: '#/components/schemas/MatchCategory'
          nullable: true
        match_state:
          $ref: '#/components/schemas/MatchState'
        factor:
          type: number
          format: float
        matched_candidate_skill_id:
          type: integer
          nullable: true
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/MatchEvidenceRef'
        justification:
          type: string
          nullable: true
        confidence:
          type: string
          nullable: true
        classifier_source:
          type: string
          nullable: true
        display_order:
          type: integer

    MatchAnalysis:
      type: object
      properties:
        id:
          type: integer
        candidate_profile_id:
          type: integer
        job_opportunity_id:
          type: integer
        status:
          $ref: '#/components/schemas/MatchAnalysisStatus'
        overall_score:
          type: number
          format: float
          nullable: true
        evidence_coverage_score:
          type: number
          format: float
          nullable: true
        counts:
          $ref: '#/components/schemas/MatchCounts'
        versions:
          $ref: '#/components/schemas/MatchVersions'
        fingerprints:
          $ref: '#/components/schemas/MatchFingerprints'
        stale:
          type: boolean
        latest:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        failure:
          $ref: '#/components/schemas/MatchFailure'
        classifier:
          $ref: '#/components/schemas/MatchClassifier'
        request_id:
          type: string
          nullable: true
        score_components:
          type: array
          items:
            $ref: '#/components/schemas/MatchScoreComponent'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/MatchFinding'
        timestamps:
          $ref: '#/components/schemas/MatchTimestamps'

    MatchOperation:
      type: object
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/MatchAnalysisStatus'
        candidate_profile_id:
          type: integer
        job_opportunity_id:
          type: integer
        request_id:
          type: string
          nullable: true
        failure_code:
          type: string
          nullable: true
        failure_reason:
          type: string
          nullable: true
        queued_at:
          type: string
          format: date-time
          nullable: true
        processing_started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        failed_at:
          type: string
          format: date-time
          nullable: true

    MatchListMeta:
      type: object
      properties:
        path:
          type: string
        per_page:
          type: integer
        next_cursor:
          type: string
          nullable: true
        prev_cursor:
          type: string
          nullable: true

    MatchList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MatchAnalysis'
        meta:
          $ref: '#/components/schemas/MatchListMeta'

paths:
  /api/v1/opportunities/ingestions:
    get:
      summary: List job ingestions
      tags: [Job Ingestion]
      security:
        - cookie: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
          description: Filter by status
      responses:
        '200':
          description: Paginated list of user's ingestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobIngestion'
    post:
      summary: Create a job ingestion
      tags: [Job Ingestion]
      security:
        - cookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_description]
              properties:
                source_description:
                  type: string
                  minLength: 50
                source_url:
                  type: string
                  format: uri
                personal_label:
                  type: string
      responses:
        '201':
          description: Ingestion created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobIngestion'
        '409':
          description: Duplicate ingestion detected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetail'
                  - type: object
                    properties:
                      code:
                        type: string
                        const: duplicate_ingestion
                      errors:
                        type: object
                        required: [existing_ingestion_id, existing_status]
                        properties:
                          existing_ingestion_id:
                            type: integer
                          existing_opportunity_id:
                            type:
                              - integer
                              - 'null'
                          existing_status:
                            type: string
                            enum: [draft, queued, processing, review_ready, confirmed, failed, cancelled]
  /api/v1/opportunities/ingestions/{ingestion}:
    get:
      summary: Show ingestion details
      tags: [Job Ingestion]
      security:
        - cookie: []
      parameters:
        - in: path
          name: ingestion
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ingestion details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobIngestion'
    delete:
      summary: Cancel an ingestion
      tags: [Job Ingestion]
      security:
        - cookie: []
      parameters:
        - in: path
          name: ingestion
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ingestion cancelled
  /api/v1/opportunities/ingestions/{ingestion}/retry:
    post:
      summary: Retry failed ingestion
      tags: [Job Ingestion]
      security:
        - cookie: []
      parameters:
        - in: path
          name: ingestion
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ingestion queued for retry
  /api/v1/opportunities/ingestions/{ingestion}/reanalyze:
    post:
      summary: Reanalyze a cancelled ingestion in place
      tags: [Job Ingestion]
      security:
        - cookie: []
      parameters:
        - in: path
          name: ingestion
          required: true
