  /api/v1/opportunities/{opportunity}/matches:
    post:
      summary: Start a match analysis for an opportunity
      description: |
        Creates a queued match analysis for a confirmed opportunity owned by the
        authenticated candidate. Returns 202 with an operation resource and a
        Location header for polling. Replaying the same Idempotency-Key returns
        the existing operation instead of creating a duplicate.
      tags: [Match Analysis]
      security:
        - cookie: []
      parameters:
        - name: opportunity
          in: path
          required: true
          schema:
            type: integer
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{8,128}$'
          description: Client idempotency key (8-128 chars, [A-Za-z0-9._:-])
        - name: X-Request-ID
          in: header
          required: false
          schema:
            type: string
          description: Client-provided request ID propagated through the analysis job
      responses:
        '202':
          description: Match analysis queued for processing
          headers:
            Location:
              description: Polling location for the analysis operation
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MatchOperation'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Opportunity not found or not owned by the candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Opportunity is not confirmed (opportunity_not_confirmed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Profile lacks the minimum trusted data (insufficient_profile)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Match creation rate limit exceeded (10 per minute)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    get:
      summary: List match analyses for an opportunity
      description: |
        Returns the candidate's match analyses for the opportunity, newest first,
        using cursor pagination. The latest analysis is flagged.
      tags: [Match Analysis]
      security:
        - cookie: []
      parameters:
        - name: opportunity
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Paginated match analyses, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchList'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Opportunity not found or not owned by the candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Unknown filter or sort parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/matches/{matchAnalysis}:
    get:
      summary: Show a match analysis
      description: |
        Returns the full analysis including category scores, per-requirement
