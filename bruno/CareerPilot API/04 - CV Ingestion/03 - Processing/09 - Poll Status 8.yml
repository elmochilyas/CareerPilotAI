info:
  name: 09 - Poll Status 8
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cv/{{cvDocumentForProcessing}}"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        function sleep(ms) { var start = Date.now(); while (Date.now() - start < ms) {} }
        sleep(1000);
    - type: after-response
      code: |-
        const httpStatus = res.getStatus();

        if (httpStatus !== 200) {
          test("Unexpected status " + httpStatus, function () { expect(true).to.be.true; });
          return;
        }

        const status = res.getBody().data.status;

        test("Status is not failed", function () {
          expect(status).to.not.equal("failed");
        });

        if (status === "ready_for_review") {
          bru.setVar("cvProcessingComplete", "true");
        }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
