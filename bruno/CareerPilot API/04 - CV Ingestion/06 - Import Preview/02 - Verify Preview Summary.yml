info:
  name: 02 - Verify Preview Summary
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cv/{{cvDocumentForProcessing}}/import-preview"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Preview does not modify profile", function () {
          expect(res.getBody().data.ready).to.equal(true);
        });

        const summary = res.getBody().data.summary;
        test("Total matches suggestion count", function () {
          expect(summary.total).to.be.at.least(1);
        });

        test("Rejected count is tracked", function () {
          expect(summary.rejected).to.be.at.least(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
