info:
  name: 01 - Generate Import Preview
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cv/{{cvDocumentForProcessing}}/import-preview"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Has data with summary", function () {
          const body = res.getBody();
          expect(body).to.have.property("data");
          expect(body.data).to.have.property("summary");
        });

        test("Summary has correct fields", function () {
          const summary = res.getBody().data.summary;
          expect(summary).to.have.property("total");
          expect(summary).to.have.property("accepted");
          expect(summary).to.have.property("rejected");
          expect(summary).to.have.property("keep_existing");
          expect(summary).to.have.property("edited");
        });

        test("Preview is ready", function () {
          expect(res.getBody().data.ready).to.equal(true);
        });

        test("Has profile_updated_at", function () {
          expect(res.getBody().data).to.have.property("profile_updated_at");
        });

        const preview = res.getBody().data;
        bru.setVar("importPreviewAccepted", String(preview.summary.accepted));
        bru.setVar("importPreviewToken", preview.profile_updated_at || "");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
