info:
  name: 03 - Verify Import Result
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cv/{{cvDocumentForProcessing}}/import-result"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns import batch", function () {
          const body = res.getBody();
          expect(body).to.have.property("data");
          expect(body.data.status).to.equal("applied");
        });

        test("Summary matches expected shape", function () {
          const summary = res.getBody().data.summary;
          expect(summary).to.have.property("total_accepted");
          expect(summary).to.have.property("fields_updated");
          expect(summary).to.have.property("items_created");
          expect(summary).to.have.property("skills_added");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
