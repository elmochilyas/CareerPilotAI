info:
  name: 05 - Get Fresh Token For Any Followup
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/sanctum/csrf-cookie"
  headers:
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("CSRF cookie received", function () {
          const xsrfCookie = bru.cookies.get("XSRF-TOKEN");
          expect(xsrfCookie).to.exist;
        });

        console.log("Session refreshed. CV ingestion test suite complete.");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
