info:
  name: 03 - Delete Extra Document
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/cv/{{cvDocumentExtra}}"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        const httpStatus = res.getStatus();
        if (httpStatus !== 200) {
          test("Unexpected status " + httpStatus + " (may not exist)", function () { expect(true).to.be.true; });
          return;
        }
        test("Status 200", function () {
          expect(httpStatus).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
