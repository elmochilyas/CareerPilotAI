info:
  name: 04 - Reject Empty File
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/cv"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: ["04 - CV Ingestion/fixtures/empty.pdf"]
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN cookie is missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        
        const httpStatus = res.getStatus();

        if (httpStatus === 422) {
          test("Status 422", function () { expect(true).to.be.true; });

          test("Error code is file_empty", function () {
            expect(res.getBody().code).to.equal("file_empty");
          });
        }

        if (httpStatus === 429) {
          test("Status 429 rate limited", function () { expect(true).to.be.true; });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
