info:
  name: 05 - Reject Missing File Field
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/cv"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  body:
    type: json
    data: |-
      {}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN cookie is missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        
        const httpStatus = res.getStatus();

        if (httpStatus === 422) {
          test("Status 422", function () { expect(true).to.be.true; });

          test("Has errors for file field", function () {
            const body = res.getBody();
            expect(body).to.have.property("errors");
            expect(body.errors).to.have.property("file");
          });
        }

        if (httpStatus === 429) {
          test("Status 429 rate limited", function () { expect(true).to.be.true; });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
