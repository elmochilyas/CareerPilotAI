info:
  name: 02 - Import Result Returns Batch
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cv/{{cvDocumentForProcessing}}/import-result"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns batch data", function () {
          expect(res.getBody()).to.have.property("data");
          expect(res.getBody().data).to.have.property("id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
