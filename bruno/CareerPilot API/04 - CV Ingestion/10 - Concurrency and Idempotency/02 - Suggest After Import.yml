info:
  name: 02 - Suggest After Import
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/cv/{{cvDocumentForProcessing}}/suggestions/{{lastSuggestionId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  body:
    type: json
    data: |-
      {
        "review_status": "accepted"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 409", function () {
          const status = res.getStatus();
          expect(status === 409 || status === 422).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
