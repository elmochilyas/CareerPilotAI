info:
  name: 01 - Apply After Import
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/cv/{{cvDocumentForProcessing}}/apply"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
    - name: Idempotency-Key
      value: "{{importIdempotencyKey}}-retry"
  body:
    type: json
    data: |-
      {}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 409", function () {
          expect(res.getStatus()).to.equal(409);
        });

        test("Conflict because already imported", function () {
          expect(res.getBody().status).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
