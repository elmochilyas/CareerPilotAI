info:
  name: 03 - Preview After Import
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cv/{{cvDocumentForProcessing}}/import-preview"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 200 or 409", function () {
          const status = res.getStatus();
          expect(status === 200 || status === 409).to.equal(true);
        });

        if (res.getStatus() === 409) {
          test("Conflict for re-import", function () {
            expect(res.getBody().code).to.match(/import|already/);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
