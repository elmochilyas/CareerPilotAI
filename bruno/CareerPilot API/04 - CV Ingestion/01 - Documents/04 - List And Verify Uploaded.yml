info:
  name: 04 - List And Verify Uploaded
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cv"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        const docId = Number(bru.getVar("cvDocumentId"));

        if (!docId) {
          test("No document uploaded in this run", function () { expect(true).to.be.true; });
          return;
        }

        test("Uploaded document appears in list", function () {
          const body = res.getBody();
          expect(body.data).to.be.an("array");

          const found = body.data.some(function (d) {
            return d.id === docId;
          });
          expect(found).to.equal(true);
        });

        test("Uploaded document has queued status", function () {
          const body = res.getBody();
          const doc = body.data.find(function (d) {
            return d.id === docId;
          });
          expect(doc.status).to.equal("queued");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
