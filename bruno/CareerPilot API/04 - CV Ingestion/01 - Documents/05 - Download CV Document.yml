info:
  name: 05 - Download CV Document
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cv/{{cvDocumentId}}/download"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const status = res.getStatus();

        if (status === 200) {
          test("Status 200", function () { expect(true).to.be.true; });

          test("Content-Type is application/pdf", function () {
            expect(res.getHeader("content-type")).to.include("application/pdf");
          });
        }

        if (status === 404) {
          test("Status 404 not found", function () { expect(true).to.be.true; });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
