info:
  name: 01 - List CV Documents
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cv"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response is JSON", function () {
          expect(res.getHeader("content-type")).to.include("application/json");
        });

        test("Returns data array", function () {
          expect(res.getBody()).to.have.property("data");
          expect(res.getBody().data).to.be.an("array");
        });

        test("Has pagination meta", function () {
          expect(res.getBody()).to.have.property("meta");
          expect(res.getBody().meta).to.have.property("has_more");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
