info:
  name: 03 - View CV Document
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cv/{{cvDocumentId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const status = res.getStatus();

        if (status === 200) {
          test("Status 200", function () { expect(true).to.be.true; });

          test("Returns document data", function () {
            const body = res.getBody();
            expect(body).to.have.property("data");
            expect(body.data.id).to.equal(Number(bru.getVar("cvDocumentId")));
          });

          test("Latest run is loaded", function () {
            expect(res.getBody().data).to.have.property("latest_run");
          });

          test("Status is queued", function () {
            expect(res.getBody().data.status).to.equal("queued");
          });

          test("Has ISO dates", function () {
            const doc = res.getBody().data;
            expect(doc.created_at).to.match(/^\d{4}-\d{2}-\d{2}T/);
            expect(doc.updated_at).to.match(/^\d{4}-\d{2}-\d{2}T/);
          });

          const doc = res.getBody().data;
          bru.setVar("cvDocumentUpdatedAt", doc.updated_at);
        }

        if (status === 404) {
          test("Status 404 not found", function () { expect(true).to.be.true; });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
