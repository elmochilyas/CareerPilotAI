info:
  name: 07 - Verify Deleted Document
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cv/{{cvDocumentId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 404", function () {
          expect(res.getStatus()).to.equal(404);
        });

        test("Is problem detail", function () {
          const body = res.getBody();
          expect(body).to.have.property("type");
          expect(body).to.have.property("title");
          expect(body).to.have.property("status");
          expect(body).to.have.property("detail");
        });

        test("Status is 404 in body", function () {
          expect(res.getBody().status).to.equal(404);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
