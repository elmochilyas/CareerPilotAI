info:
  name: 09 - Cleanup Duplicate Skill
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/candidate/skills/{{duplicateCustomSkillId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 204", function () {
          expect(res.getStatus()).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
