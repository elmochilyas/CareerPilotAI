info:
  name: 05 - Duplicate Canonical Skill
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/candidate/skills"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  body:
    type: json
    data: |-
      {
        "skill_id": 1,
        "state": "claimed",
        "proficiency_level": "beginner"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 409", function () {
          expect(res.getStatus()).to.equal(409);
        });

        test("Error code is candidate_skill_duplicate", function () {
          const body = res.getBody();
          expect(body.code).to.equal("candidate_skill_duplicate");
        });

        test("Problem details structure", function () {
          const body = res.getBody();
          expect(body).to.have.property("status");
          expect(body.status).to.equal(409);
          expect(body).to.have.property("detail");
          expect(body).to.have.property("type");
        });

        const body = res.getBody();
        bru.setVar("duplicateErrorDetail", body.detail);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
