info:
  name: 06 - Delete Candidate Skill
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/candidate/skills/{{claimedCandidateSkillId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error(
            "XSRF-TOKEN cookie is missing. Run CSRF Cookie and Login first."
          );
        }
        req.setHeader(
          "X-XSRF-TOKEN",
          decodeURIComponent(xsrfToken)
        );
    - type: after-response
      code: |-
        test("Status code is 204", function () {
          expect(res.getStatus()).to.equal(204);
        });

        test("No content body", function () {
          const body = res.getBody();
          expect(body === null || body === "").to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
