info:
  name: 00 - Get Catalog Reference
  type: http
  seq: 0

http:
  method: GET
  url: "{{baseUrl}}/api/v1/skills?q=JavaScript"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("JavaScript skill found", function () {
          const body = res.getBody();
          expect(body.data).to.be.an("array").that.is.not.empty;
          expect(body.data[0].name).to.equal("JavaScript");
        });

        const body = res.getBody();
        bru.setVar("catalogSkillId", String(body.data[0].id));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
