info:
  name: 03 - View Created Candidate Skill
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/candidate/skills/{{claimedCandidateSkillId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response is JSON", function () {
          expect(res.getHeader("content-type")).to.include("application/json");
        });

        test("Skill data is correct", function () {
          const body = res.getBody();
          const item = body.data ?? body;
          expect(item.id).to.equal(Number(bru.getVar("claimedCandidateSkillId")));
          expect(item.state).to.equal("claimed");
          expect(item.proficiency_level).to.equal("intermediate");
          expect(item.skill.name).to.equal("JavaScript");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
