info:
  name: 02 - Create Skill
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/candidate/skills"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  body:
    type: json
    data: |-
      {
        "skill_id": {{completionCatalogSkillId}},
        "state": "claimed",
        "proficiency_level": "advanced"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        const item = res.getBody().data;
        bru.setVar("completionCandidateSkillId", String(item.id));
        bru.setVar("completionSkillUpdatedAt", item.updated_at);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
