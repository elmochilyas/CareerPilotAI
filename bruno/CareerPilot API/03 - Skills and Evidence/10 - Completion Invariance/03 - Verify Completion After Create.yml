info:
  name: 03 - Verify Completion After Create
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/profile"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Completion unchanged after skill creation", function () {
          const profile = res.getBody().data;
          expect(String(profile.profile_completion)).to.equal(
            bru.getVar("profileCompletionBefore")
          );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
