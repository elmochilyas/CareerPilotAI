info:
  name: 04 - Add Evidence
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/candidate/skills/{{completionCandidateSkillId}}/evidence"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  body:
    type: json
    data: |-
      {
        "type": "url",
        "value": "https://example.com/careerpilot-completion-test",
        "label": "Completion invariance test"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        const item = res.getBody().data;
        bru.setVar("completionSkillUpdatedAt", item.updated_at);
        bru.setVar("completionEvidenceKey", item.evidence[item.evidence.length - 1].key);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
