info:
  name: 06 - Claimed To Verified Without Evidence
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/candidate/skills/{{transitionSkillId_claimed}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  body:
    type: json
    data: |-
      {
        "state": "verified",
        "updated_at": "{{transitionSkillUpdatedAt}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 422", function () {
          expect(res.getStatus()).to.equal(422);
        });

        test("Error code is skill_verification_requirements_not_met", function () {
          expect(res.getBody().code).to.equal("skill_verification_requirements_not_met");
        });

        test("State is still claimed (not changed)", function () {
          const body = res.getBody();
          expect(body.status).to.equal(422);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
