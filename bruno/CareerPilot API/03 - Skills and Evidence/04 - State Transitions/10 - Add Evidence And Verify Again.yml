info:
  name: 10 - Add Evidence And Verify Again
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/v1/candidate/skills/{{transitionSkillId_claimed}}/evidence"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  body:
    type: json
    data: |-
      {
        "type": "url",
        "value": "https://example.com/careerpilot-transition-test-2",
        "label": "Transition test evidence 2"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        const item = res.getBody().data;
        bru.setVar("transitionSkillUpdatedAt", item.updated_at);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
