info:
  name: 14 - Delete Transition Skills
  type: http
  seq: 14

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/candidate/skills/{{transitionSkillId_claimed}}"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 422 - verified skill cannot be deleted", function () {
          expect(res.getStatus()).to.equal(422);
        });

        test("Error code is candidate_skill_removal_forbidden", function () {
          expect(res.getBody().code).to.equal("candidate_skill_removal_forbidden");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
