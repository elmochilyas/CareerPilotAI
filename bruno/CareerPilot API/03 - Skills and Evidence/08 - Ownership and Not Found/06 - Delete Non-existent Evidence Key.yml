info:
  name: 06 - Delete Non-existent Evidence Key
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/candidate/skills/{{claimedCandidateSkillId}}/evidence/nonexistent-key-12345"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 409", function () {
          expect(res.getStatus()).to.equal(409);
        });

        test("Error code is skill_evidence_not_found", function () {
          expect(res.getBody().code).to.equal("skill_evidence_not_found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
