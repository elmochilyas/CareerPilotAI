info:
  name: 01 - View Non-existent Skill
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/candidate/skills/99999999"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 404", function () {
          expect(res.getStatus()).to.equal(404);
        });

        test("Problem details returned", function () {
          const body = res.getBody();
          expect(body).to.have.property("status");
          expect(body.status).to.equal(404);
          expect(body).to.have.property("code");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
