info:
  name: 03 - Verify Evidence In Skill
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/candidate/skills/{{evidenceCandidateSkillId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Evidence is present", function () {
          const data = res.getBody().data;
          expect(data.evidence).to.be.an("array").that.is.not.empty;
        });

        test("Evidence key matches", function () {
          const data = res.getBody().data;
          const found = data.evidence.some(function (e) {
            return e.key === bru.getVar("urlEvidenceKey");
          });
          expect(found).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
