info:
  name: 05 - Delete URL Evidence
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/candidate/skills/{{evidenceCandidateSkillId}}/evidence/{{urlEvidenceKey}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  body:
    type: json
    data: |-
      {
        "updated_at": "{{evidenceSkillUpdatedAt}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Evidence was removed", function () {
          const data = res.getBody().data;
          const found = data.evidence.some(function (e) {
            return e.key === bru.getVar("urlEvidenceKey");
          });
          expect(found).to.equal(false);
        });

        const data = res.getBody().data;
        bru.setVar("evidenceSkillUpdatedAt", data.updated_at);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
