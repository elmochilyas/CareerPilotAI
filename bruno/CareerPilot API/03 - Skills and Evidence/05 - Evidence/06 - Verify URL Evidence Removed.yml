info:
  name: 06 - Verify URL Evidence Removed
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v1/candidate/skills/{{evidenceCandidateSkillId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Evidence array is empty", function () {
          const data = res.getBody().data;
          expect(data.evidence).to.be.an("array").that.is.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
