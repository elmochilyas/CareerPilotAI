info:
  name: 04 - Duplicate Create While Archived
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/candidate/skills"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  body:
    type: json
    data: |-
      {
        "skill_id": {{archiveCatalogSkillId}},
        "state": "claimed",
        "proficiency_level": "intermediate"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 409 - duplicate even while archived", function () {
          expect(res.getStatus()).to.equal(409);
        });

        test("Error code is candidate_skill_duplicate", function () {
          expect(res.getBody().code).to.equal("candidate_skill_duplicate");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
