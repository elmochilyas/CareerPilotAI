info:
  name: 03 - Verify Archived
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/candidate/skills/{{archiveCandidateSkillId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("State is archived", function () {
          expect(res.getBody().data.state).to.equal("archived");
        });

        test("Proficiency preserved", function () {
          expect(res.getBody().data.proficiency_level).to.equal("advanced");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
