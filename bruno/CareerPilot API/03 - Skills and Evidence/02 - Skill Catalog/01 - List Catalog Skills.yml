info:
  name: 01 - List Catalog Skills
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/skills"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response is JSON", function () {
          expect(res.getHeader("content-type")).to.include("application/json");
        });

        test("Returns paginated skill collection", function () {
          const body = res.getBody();
          expect(body).to.have.property("data");
          expect(body.data).to.be.an("array").that.is.not.empty;
        });

        test("Skill items have correct structure", function () {
          const body = res.getBody();
          const skill = body.data[0];

          expect(skill).to.have.property("id");
          expect(skill).to.have.property("name");
          expect(skill).to.have.property("normalized_name");
          expect(skill).to.have.property("category");
          expect(skill).to.have.property("is_active");
        });

        test("Response has pagination meta", function () {
          const body = res.getBody();

          expect(body).to.have.property("meta");
          expect(body.meta).to.have.property("total");
        });

        const body = res.getBody();
        const firstSkill = body.data[0];
        bru.setVar("catalogSkillId", String(firstSkill.id));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
