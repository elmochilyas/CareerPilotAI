info:
  name: 04 - Search With No Results
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/skills?q=zzzzzzzznonexistent"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns empty results", function () {
          const body = res.getBody();
          expect(body.data).to.be.an("array").that.is.empty;
        });

        test("Pagination meta present", function () {
          const body = res.getBody();
          expect(body).to.have.property("meta");
          expect(body.meta.total).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
