info:
  name: 02 - Search Catalog Skills
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/skills?q=PHP"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns filtered results", function () {
          const body = res.getBody();
          expect(body.data).to.be.an("array").that.is.not.empty;
        });

        test("First result is PHP-relevant", function () {
          const body = res.getBody();
          const first = body.data[0];
          const nameMatch = first.name.toLowerCase().includes("php");
          const aliasMatch = (first.aliases || []).some(function (a) {
            return a.toLowerCase().includes("php");
          });
          expect(nameMatch || aliasMatch).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
