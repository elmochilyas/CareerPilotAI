info:
  name: 03 - Get Catalog Skill
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/skills/{{catalogSkillId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns single skill resource", function () {
          const body = res.getBody();
          expect(body).to.have.property("data");
          expect(body.data).to.have.property("id");
          expect(body.data).to.have.property("name");
          expect(body.data).to.have.property("category");
          expect(body.data).to.have.property("aliases");
          expect(body.data.aliases).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
