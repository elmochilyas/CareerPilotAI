info:
  name: 03 - Stale Update Returns 409
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/candidate/skills/{{concurrencyCandidateSkillId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  body:
    type: json
    data: |-
      {
        "proficiency_level": "expert",
        "updated_at": "{{staleCandidateSkillUpdatedAt}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 409", function () {
          expect(res.getStatus()).to.equal(409);
        });

        test("Error code is candidate_skill_conflict", function () {
          expect(res.getBody().code).to.equal("candidate_skill_conflict");
        });

        test("Detail mentions modified by another request", function () {
          const detail = res.getBody().detail;
          expect(detail.toLowerCase()).to.include("modified");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
