info:
  name: 02 - Valid Update With Current Updated At
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/candidate/skills/{{concurrencyCandidateSkillId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  body:
    type: json
    data: |-
      {
        "proficiency_level": "advanced",
        "updated_at": "{{currentCandidateSkillUpdatedAt2}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const xsrfToken = bru.cookies.get("XSRF-TOKEN");
        if (!xsrfToken) {
          throw new Error("XSRF-TOKEN missing.");
        }
        req.setHeader("X-XSRF-TOKEN", decodeURIComponent(xsrfToken));
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Proficiency updated to advanced", function () {
          expect(res.getBody().data.proficiency_level).to.equal("advanced");
        });

        const item = res.getBody().data;
        bru.setVar("freshCandidateSkillUpdatedAt", item.updated_at);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
