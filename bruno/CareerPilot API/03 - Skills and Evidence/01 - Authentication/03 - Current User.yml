info:
  name: 03 - Current User
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/me"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendUrl}}"
    - name: Referer
      value: "{{frontendUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response is JSON", function () {
          expect(res.getHeader("content-type")).to.include("application/json");
        });

        test("Authenticated user is returned", function () {
          const body = res.getBody();
          expect(body).to.have.property("data");
          expect(body.data).to.have.property("id");
          expect(body.data.email).to.equal("bruno.test@example.com");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
